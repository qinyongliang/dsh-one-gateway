# One Gateway: OpenAI-compatible /v1 for every connected model.
# Groups, aliases, sticky sessions, usage charts, API keys.
# The gateway serves its OWN listener on lanPort and does not mount on DSH's web
# server: that port belongs to DSH, so answering /v1 there would put the OpenAI
# surface on DSH's own address. Set `mount: true` to opt back in. Create an API
# key on the gateway page before exposing the listener to other devices.
- insert:
    - id: dsh-one-gateway
      name: dsh-one-gateway
      inject:
        - llm
        - webServer
      config:
        path: /v1
        mount: false
        lanPort: 3090
        lanHost: 0.0.0.0
